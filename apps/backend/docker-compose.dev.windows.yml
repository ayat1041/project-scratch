services:
  redis:
    image: redis:7.2.4
    container_name: starter-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./src/config/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    environment:
      - REDIS_PASSWORD=starterRedis123
    networks:
      - starter-app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "starterRedis123", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  mailhog:
    image: mailhog/mailhog:latest
    container_name: starter-mailhog-dev
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - starter-app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:15
    container_name: starter-database-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - starter-pg-data:/var/lib/postgresql/data
    networks:
      - starter-app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  app-dev:
    build:
      context: ../../
      dockerfile: apps/backend/Dockerfile
      target: dev
    container_name: starter-app-dev
    user: root
    ports:
      - "8000:8000"
    restart: on-failure:3
    env_file:
      - .env
    environment:
      - NODE_OPTIONS=--max-old-space-size=4096
    volumes:
      - ../../apps/backend/src:/app/apps/backend/src
      - ../../packages:/app/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - starter-app-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

