worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # No static `upstream {}` block on purpose — that form resolves the
  # service name once at nginx startup and won't pick up replicas added
  # later with --scale. Re-resolving via $variable + resolver (below)
  # keeps the backend set current.
  resolver 127.0.0.11 valid=10s;

  # Generous ceiling for file uploads — nginx's 1m default otherwise 413s any
  # upload before it reaches Express. Tune down to match your app's actual
  # max upload size if you add file-upload endpoints.
  client_max_body_size 50m;

  server {
    listen 80;

    keepalive_timeout 65s;
    proxy_read_timeout 65s;
    proxy_connect_timeout 5s;

    location /health {
      set $api_upstream app-dev:8000;
      proxy_pass http://$api_upstream;
    }

    location / {
      set $api_upstream app-dev:8000;
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
