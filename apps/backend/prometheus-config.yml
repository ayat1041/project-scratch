global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "starter-local-api"
    static_configs:
      - targets: ["app-dev:8000"]
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: "postgres-exporter"
    scrape_interval: 5s
    static_configs:
      - targets: ["postgres-exporter:9187"]
