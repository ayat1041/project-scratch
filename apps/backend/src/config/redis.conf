# Redis Configuration File

# Authentication
requirepass starterRedis123

# Persistence
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory Management
maxmemory 256mb
maxmemory-policy noeviction

# Networking
bind 0.0.0.0
port 6379
protected-mode yes

# Logging
loglevel notice
logfile ""

# Other optimizations
tcp-keepalive 300
timeout 0
databases 16

# Save snapshots (optional - you can disable if you only want AOF)
save 900 1
save 300 10
save 60 10000

# Security - disable dangerous commands
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command SHUTDOWN SHUTDOWN_SAFE
rename-command DEBUG ""
rename-command CONFIG CONFIG_SAFE