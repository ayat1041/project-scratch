[defaults]
# Inventory settings
inventory = inventory/hosts.yml
# host_key_checking defaults to True — do NOT set False in production.
# Add the server's host key once with:
#   ssh-keyscan -H <ip> >> ~/.ssh/known_hosts

# Output settings
# Use the builtin default callback and set the result format to YAML
# (the 'community.general.yaml' callback was removed in newer collections)
stdout_callback = default
result_format = yaml
display_skipped_hosts = False
display_ok_hosts = True

# Role settings
roles_path = ./roles

# Connection settings
timeout = 30
remote_user = {{ admin_user }}
private_key_file = ~/.ssh/id_ed25519

# Performance settings
forks = 10
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600

# Retry settings
retry_files_enabled = True
retry_files_save_path = ~/.ansible-retry

# Logging
log_path = ./ansible.log

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
control_path = ~/.ansible/cp/%%h-%%p-%%r
