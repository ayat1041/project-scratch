---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: base-packages-ubuntu
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /lib/systemd/systemd
provisioner:
  name: ansible
  inventory:
    host_vars:
      base-packages-ubuntu:
        timezone: UTC
verifier:
  name: ansible
