---
- name: Ensure Postgres data directory exists
  ansible.builtin.file:
    path: "{{ postgres.data_dir }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0750"
  become: true

- name: Ensure the common network exists
  community.docker.docker_network:
    name: "{{ postgres.network }}"
    state: present
  become: true

- name: Run PostgreSQL container
  community.docker.docker_container:
    name: "{{ postgres.container_name }}"
    image: "{{ postgres.version }}"
    state: started
    restart_policy: "unless-stopped"
    published_ports:
      - "{{ postgres.host_port }}:{{ postgres.container_port }}"
    env:
      POSTGRES_USER: "{{ postgres.user }}"
      POSTGRES_PASSWORD: "{{ postgres.password }}"
      POSTGRES_DB: "{{ postgres.db }}"
    volumes:
      - "{{ postgres.data_dir }}:/var/lib/postgresql/data"
    networks:
      - name: "{{ postgres.network }}"
        aliases:
          - "{{ postgres.network_alias }}"
    healthcheck: "{{ postgres.healthcheck }}"
  register: postgres_container
  become: true

- name: Wait until PostgreSQL is healthy
  community.docker.docker_container_info:
    name: "{{ postgres.container_name }}"
  register: pg_info
  until: pg_info.container.State.Health.Status == "healthy"
  retries: 10
  delay: 5
  become: true

- name: Show PostgreSQL connection string
  ansible.builtin.debug:
    msg: >
      PostgreSQL is running!
      Connection string:
      postgresql://{{ postgres.user }}:{{ postgres.password }}@{{ ansible_host | default(inventory_hostname) }}:{{ postgres.host_port }}/{{ postgres.db }}
