---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: nginx-base-ubuntu
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /lib/systemd/systemd
    exposed_ports:
      - "80/tcp"
provisioner:
  name: ansible
verifier:
  name: ansible
