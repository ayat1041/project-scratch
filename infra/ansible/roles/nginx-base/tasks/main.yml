---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Enable Nginx service
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: Allow Nginx through UFW
  community.general.ufw:
    rule: allow
    name: "Nginx Full"

- name: Deploy default catch-all vhost (blocks direct IP access)
  ansible.builtin.template:
    src: default-catch-all.conf.j2
    dest: /etc/nginx/sites-available/00-catch-all
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Enable default catch-all vhost
  ansible.builtin.file:
    src: /etc/nginx/sites-available/00-catch-all
    dest: /etc/nginx/sites-enabled/00-catch-all
    state: link
  notify: reload nginx

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx
