---
- name: Converge
  hosts: all
  gather_facts: true
  become: true
  pre_tasks:
    - name: Install nginx (prerequisite — normally done by nginx-base role)
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
    - name: Start nginx
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true
  roles:
    - role: nginx-vhost
