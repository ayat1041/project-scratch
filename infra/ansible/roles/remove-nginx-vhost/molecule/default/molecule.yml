---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: remove-nginx-vhost-ubuntu
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /lib/systemd/systemd
provisioner:
  name: ansible
  inventory:
    host_vars:
      remove-nginx-vhost-ubuntu:
        nginx:
          domain_name: "test.example.com"
verifier:
  name: ansible
