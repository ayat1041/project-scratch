---
# Default variables for security-hardening role
# Override these in group_vars, host_vars, or playbook vars

# User configuration
admin_user: "admin"
admin_public_key: ""

# SSH configuration
ssh_port: 22
ssh_max_auth_tries: 3
ssh_max_sessions: 2
ssh_login_grace_time: "30s"
remove_ssh_22: false

# Fail2Ban configuration
admin_trusted_ips: []
f2b_maxretry: 5
f2b_findtime: "10m"
f2b_bantime: "1h"

# Firewall configuration
firewall_allowed_ports:
  - "22/tcp"
  - "80/tcp"
  - "443/tcp"

firewall_deny_ports: []
