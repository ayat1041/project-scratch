---
# Ensure admin user exists with your key
- name: Ensure admin user exists
  become: true
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: sudo
    append: true
    shell: /bin/bash

- name: Install admin public key
  become: true
  ansible.builtin.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ admin_public_key }}"

- name: Configure SSH
  template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    backup: yes
    mode: "0644"
  notify: restart ssh

- name: Configure UFW firewall
  block:
    - name: Reset UFW to defaults
      ufw:
        state: reset

    - name: Set UFW default policies
      ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: "incoming", policy: "deny" }
        - { direction: "outgoing", policy: "allow" }

    - name: Allow specified ports through UFW
      ufw:
        rule: allow
        port: "{{ item.split('/')[0] }}"
        proto: "{{ item.split('/')[1] }}"
      loop: "{{ firewall_allowed_ports }}"

    - name: Enable UFW
      ufw:
        state: enabled

- name: Configure Fail2Ban
  template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
  notify: restart fail2ban

- name: Enable and start Fail2Ban
  systemd:
    name: fail2ban
    enabled: yes
    state: started

- name: Disable unused network protocols
  lineinfile:
    path: /etc/modprobe.d/blacklist-rare-network.conf
    line: "install {{ item }} /bin/true"
    create: yes
  loop:
    - dccp
    - sctp
    - rds
    - tipc

- name: Configure kernel security parameters
  template:
    src: 99-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
  notify: reload sysctl

- name: Install msmtp and logwatch
  ansible.builtin.package:
    name:
      - msmtp
      - logwatch
    state: present
  become: true

- name: Configure msmtp for external SMTP
  ansible.builtin.copy:
    dest: /etc/msmtprc
    content: |
      defaults
      auth           on
      tls            on
      tls_trust_file /etc/ssl/certs/ca-certificates.crt
      logfile        /var/log/msmtp.log

      account        default
      host           "{{ email_smtp_host }}"
      port           "{{ email_smtp_port }}"
      from           "{{ email_smtp_from }}"
      user           "{{ email_smtp_user }}"
      password       "{{ email_smtp_password }}"
      set_from_header on
      maildomain     "{{ mail_domain }}"
    mode: "0600"
    owner: root
    group: root
  become: true

- name: Ensure sendmail points to msmtp (sendmail wrapper)
  ansible.builtin.file:
    path: /usr/sbin/sendmail
    state: link
    src: /usr/bin/msmtp
    force: yes
  become: true

- name: Configure Logwatch to send email to admin
  ansible.builtin.lineinfile:
    path: /usr/share/logwatch/default.conf/logwatch.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: "^MailTo =", line: "MailTo = {{ admin_email }}" }
    - { regexp: "^Range =", line: "Range = yesterday" }
    - { regexp: "^Detail =", line: "Detail = Med" }
  become: true

- name: Ensure Logwatch output uses mail
  ansible.builtin.lineinfile:
    path: /usr/share/logwatch/default.conf/logwatch.conf
    regexp: "^Output ="
    line: "Output = mail"
  become: true

- name: Test Logwatch email (dry-run)
  ansible.builtin.shell: |
    logwatch --output mail --mailto {{ admin_email }} --range yesterday --service all
  register: logwatch_test
  ignore_errors: yes

- name: Create security maintenance script
  copy:
    dest: /usr/local/bin/security-maintenance.sh
    mode: "0755"
    content: |
      #!/bin/bash
      echo "Running security maintenance..."
      apt update && apt upgrade -y
      apt autoremove -y
      apt autoclean
      docker system prune -f
      echo "System maintenance completed on $(date)" >> /var/log/maintenance.log

- name: Add weekly maintenance cron job
  cron:
    name: "Weekly security maintenance"
    minute: "0"
    hour: "2"
    weekday: "0"
    job: "/usr/local/bin/security-maintenance.sh"
