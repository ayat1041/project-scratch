global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: starter

scrape_configs:
  # ------------------------------------------------------------
  # App API
  # Requires the app to expose GET /metrics (prom-client or NestJS Prometheus)
  # ------------------------------------------------------------
  - job_name: app-api-dev
    scheme: https
    static_configs:
      - targets: ["devapi.example.com:443"]
        labels:
          env: dev

  - job_name: app-api-staging
    scheme: https
    static_configs:
      - targets: ["stagingapi.example.com:443"]
        labels:
          env: staging

  # ------------------------------------------------------------
  # Monitoring stack self-monitoring
  # ------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  # ------------------------------------------------------------
  # Host metrics — uncomment after deploying node-exporter on the VPS
  # Deploy: docker run -d --net="host" --pid="host" -v "/:/host:ro,rslave"
  #         prom/node-exporter:v1.8.0 --path.rootfs=/host
  # ------------------------------------------------------------
  # - job_name: node-exporter
  #   static_configs:
  #     - targets: ["CHANGE_ME_HOST_IP:9100"]
  #       labels:
  #         host: app-vps

  # ------------------------------------------------------------
  # Container metrics — uncomment after deploying cAdvisor on the VPS
  # Deploy: docker run -d --name cadvisor --privileged \
  #         -v /:/rootfs:ro -v /var/run:/var/run:ro \
  #         -v /sys:/sys:ro -v /var/lib/docker/:/var/lib/docker:ro \
  #         -p 8080:8080 gcr.io/cadvisor/cadvisor:v0.49.1
  # ------------------------------------------------------------
  # - job_name: cadvisor
  #   static_configs:
  #     - targets: ["CHANGE_ME_HOST_IP:8080"]
  #       labels:
  #         host: app-vps
